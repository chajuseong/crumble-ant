<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>거대 건물 붕괴 연출 시안</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#262432;color:#fff5e8;font:16px/1.5 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:20px}h1{font-size:1.5rem;margin:0 0 8px}p{color:#e7d8ca}button{background:#ffc75a;color:#362619;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}.frame{max-width:360px;margin:16px auto}canvas{display:block;width:100%;height:auto;border-radius:12px;background:#9bdaf6}small{color:#e7d8ca}.error{color:#ffb1a4}
</style>
<main><h1>거대한 건물이 층별로 와르르</h1><p>주택을 화면 폭 75%로 표시한 움직임 시안입니다. 아래층이 부서질 때마다 위층이 내려오고, 마지막 지붕에서 크게 터집니다.</p><div><button type="button" id="replay">다시 보기</button> <button type="button" data-time="250">첫 타격</button> <button type="button" data-time="850">층 붕괴</button> <button type="button" data-time="4600">마지막 파괴</button></div><div class="frame"><canvas id="scene" width="360" height="780" aria-label="주택 층별 붕괴 연출 시안"></canvas></div><p><small>장면 버튼은 해당 순간을 멈춰 보여 줍니다. 기존 게임 에셋을 조합한 별도 연출 시안이며 실제 게임·물리·타이밍의 재현이 아닙니다.</small></p><p class="error" id="error" role="alert"></p></main>
<script>
const paths={sky:'../../game/env/sky.png',ground:'../../game/env/ground_strip.png',base:'../../game/buildings/floors/house_floor_base.png',mid:'../../game/buildings/floors/house_floor_mid.png',roof:'../../game/buildings/floors/house_floor_roof.png',head:'../../game/ant/ant_black_head_normal.png',body:'../../game/ant/ant_black_body.png',arm:'../../game/ant/ant_black_arm.png',leg:'../../game/ant/ant_black_leg.png',weapon:'../../game/weapons/weapon_hammer.png',impact:'../../game/env/impact.png',dust:'../../game/fx/dust.png',debris:'../../game/fx/building_debris/debris_house.png',wallDebris:'../../game/fx/debris.png',ring:'../../game/fx/shock_ring.png'};
const images={},canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');let started=0,frozen=null,frameId=0,ready=false;
function load([key,path]){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{images[key]=im;resolve()};im.onerror=()=>reject(new Error(path));im.src=path})}
function drawImage(key,x,y,w,h){ctx.drawImage(images[key],x,y,w,h)}
function render(now){if(!started)started=now;const elapsed=frozen??((now-started)%6000),phase=Math.min(3,Math.floor(elapsed/1250)),t=(elapsed-phase*1250)/1250;const bottom=535,w=270,x=45,unit=230*w/720,breakTime=.62,broken=t>=breakTime,drop=Math.min(1,Math.max(0,(t-breakTime)/(120/1250)));ctx.clearRect(0,0,360,780);drawImage('sky',0,0,360,780);
const parts=['base','mid','mid','roof'];for(let i=3;i>=phase;i--){if(i===phase&&broken)continue;const key=parts[i],h=images[key].height*w/720;const yBottom=bottom-(i-phase)*unit+(broken?drop*unit:0);const shake=!broken&&t>.08&&t<.56?Math.sin(t*110)*2:0;drawImage(key,x+shake,yBottom-h,w,h)}
drawImage('ground',0,674,360,78);ctx.fillStyle='#bb7b4d';ctx.fillRect(0,751,360,29);
drawImage('leg',158,615,17,39);drawImage('leg',185,615,17,39);drawImage('arm',140,562,20,67);drawImage('arm',201,562,20,67);drawImage('arm',151,569,18,63);drawImage('arm',191,569,18,63);drawImage('body',156,579,50,64);drawImage('head',151,535,60,64);drawImage('weapon',132,523,25,53);
if(!broken&&t<.56&&Math.sin(t*42)>0.2){drawImage('impact',126,515,38,38)}
if(broken&&t<.91){const k=(t-breakTime)/(.91-breakTime),final=phase===3;ctx.save();ctx.globalAlpha=1-k;const s=(final?140:75)*(0.7+k);drawImage('dust',180-s/2,535-s*.65,s,s);if(final){const r=100+k*155;drawImage('ring',180-r/2,535-r/2,r,r)}for(let i=0;i<(final?7:4);i++){const dx=(i%2?1:-1)*(25+i*9)*k,dy=-Math.sin(k*Math.PI)*(20+i*5);drawImage(final?'debris':'wallDebris',170+dx,520+dy,18+i*2,18+i*2)}ctx.restore()}
ctx.fillStyle='#fff4dc';ctx.fillRect(0,0,360,48);ctx.fillStyle='#be554a';ctx.font='bold 16px system-ui';ctx.fillText('♥ ♥ ♥',16,30);ctx.fillStyle='#bc8550';ctx.fillRect(184,18,155,12);ctx.fillStyle='#f4c249';ctx.fillRect(184,18,100,12);if(frozen===null)frameId=requestAnimationFrame(render)}
document.getElementById('replay').addEventListener('click',()=>{if(!ready)return;cancelAnimationFrame(frameId);frozen=null;started=performance.now();frameId=requestAnimationFrame(render)});document.querySelectorAll('[data-time]').forEach(button=>button.addEventListener('click',()=>{if(!ready)return;cancelAnimationFrame(frameId);frozen=Number(button.dataset.time);render(performance.now())}));Promise.all(Object.entries(paths).map(load)).then(()=>{ready=true;frameId=requestAnimationFrame(render)}).catch(e=>{document.getElementById('error').textContent='이미지를 불러오지 못했습니다: '+e.message});
</script></html>
