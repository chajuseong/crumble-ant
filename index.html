<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1b1a17" />
    <link rel="icon" href="data:," />
    <title>와르르 개미 — 웹 프로토</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1b1a17; overflow: hidden; overscroll-behavior: none; }
      /* Safe Area 안쪽에만 게임 프레임 → 레이아웃 비율은 Safe Area 높이 기준 (기획서 §6) */
      #frame {
        position: fixed; inset: 0; box-sizing: border-box;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
      #game { width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
      #config-error { color: #ffb4a8; font: 15px/1.6 system-ui, sans-serif; padding: 24px; white-space: pre-wrap; }
      #story-loading { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: #1b1a17; }
      #story-loading img { display: block; width: 100%; height: 100%; object-fit: contain; }
      #story-continue { position: absolute; bottom: max(12px, env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); border: 0; border-radius: 999px; padding: 8px 16px; background: rgba(20, 20, 20, .78); color: white; font: 600 13px system-ui, sans-serif; white-space: nowrap; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="frame"><div id="game"></div></div>
    <div id="story-loading" role="status" aria-label="공주개미를 향해 점프하는 일개미의 이야기">
      <img id="story-image" src="./story-loading.png" alt="함께 지내던 공주개미가 하늘로 떠나자, 날개 없는 일개미가 떨어지는 건물을 부수며 뒤따라 점프합니다." />
      <button id="story-continue" type="button" hidden>탭하여 시작</button>
    </div>
    <script type="module" src="/src/view/main.ts"></script>
  </body>
</html>
