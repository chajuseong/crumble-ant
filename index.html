<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1b1a17" />
    <link rel="icon" href="data:," />
    <title>와르르 개미 — 웹 프로토</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1b1a17; overflow: hidden; overscroll-behavior: none; }
      /* Safe Area 안쪽에만 게임 프레임 → 레이아웃 비율은 Safe Area 높이 기준 (기획서 §6) */
      #frame {
        position: fixed; inset: 0; box-sizing: border-box;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
      #game { width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
      #config-error { color: #ffb4a8; font: 15px/1.6 system-ui, sans-serif; padding: 24px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="frame"><div id="game"></div></div>
    <script type="module" src="/src/view/main.ts"></script>
  </body>
</html>
